name = "leader-growth"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 画面（GitHub Pages）の置き場所だけを受け付ける。手元の確認は .dev.vars で ALLOW_LOCALHOST=1
ALLOWED_ORIGINS = "https://kotam-san.github.io"
DAILY_CAP = "300"

# IPごとの回数制限：1分に6回まで
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 6
  period = 60

# 回数だけを数える（答えの本文は保存しない）。id はデプロイ前に作って入れる
# [[kv_namespaces]]
# binding = "STATS"
# id = ""

# 鍵は wrangler secret put ANTHROPIC_API_KEY で登録する（このファイルには書かない）
